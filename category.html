<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Collection By Ibtissam — La Boutique</title>
  <meta id="meta-description" name="description" content="Découvrez la collection complète — caftans, karakou, robes de soirée, prêt-à-porter et accessoires.">
  <meta name="theme-color" content="#1A1A1A">
  <meta name="robots" content="index, follow, max-image-preview:large">

  <link id="canonical-link" rel="canonical" href="https://collectionbyibtissam.com/category">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Collection By Ibtissam">
  <meta id="og-title" property="og:title" content="Collection By Ibtissam — La Boutique">
  <meta id="og-description" property="og:description" content="Découvrez la collection complète.">
  <meta id="og-url" property="og:url" content="https://collectionbyibtissam.com/category">
  <meta property="og:image" content="https://collectionbyibtissam.com/apple-touch-icon.svg">
  <meta property="og:locale" content="fr_DZ">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Collection By Ibtissam — La Boutique">
  <meta name="twitter:description" content="Découvrez la collection complète.">
  <meta name="twitter:image" content="https://collectionbyibtissam.com/apple-touch-icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="category-page">
    <div class="container">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="category-header" id="category-header"></div>

      <!-- Category filter chips (shown on all-products view) -->
      <div class="category-filters" id="category-filters"></div>

      <div class="category-toolbar">
        <span class="category-count" id="product-count"></span>
        <div class="category-sort">
          <select id="sort-select" onchange="sortProducts(this.value)">
            <option value="newest" data-i18n="category.sort_newest">Plus Récents</option>
            <option value="price_asc" data-i18n="category.sort_price_low">Prix Croissant</option>
            <option value="price_desc" data-i18n="category.sort_price_high">Prix Décroissant</option>
            <option value="popular" data-i18n="category.sort_popular">Plus Populaires</option>
          </select>
        </div>
      </div>

      <div class="products-grid" id="products-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/components.js"></script>
  <script>
    let currentCategory = null;
    let currentFilter = null;
    let currentSort = 'newest';
    let allCategories = [];

    async function loadPage() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      currentFilter = params.get('filter');

      // Load categories for filter chips
      allCategories = await store.getCategories();

      if (slug) {
        currentCategory = await store.getCategoryBySlug(slug);
      }

      renderPageHeader();
      renderFilters();
      await loadProducts();
    }

    function renderPageHeader() {
      const header = document.getElementById('category-header');
      const bc = document.getElementById('breadcrumbs');

      let title = i18n.t('category.all_products');
      let description = '';

      if (currentCategory) {
        title = i18n.field(currentCategory, 'name');
        description = i18n.field(currentCategory, 'description');
      } else if (currentFilter === 'new') {
        title = i18n.t('home.new_arrivals');
      } else if (currentFilter === 'sale') {
        title = i18n.t('nav.sale');
      } else if (currentFilter === 'best') {
        title = i18n.t('home.best_sellers');
      } else if (currentFilter === 'featured') {
        title = i18n.t('home.featured');
      }

      document.title = `${title} — Collection By Ibtissam`;
      updateCategorySEO(title, description);

      header.innerHTML = `
        <h1>${title}</h1>
        ${description ? `<p>${description}</p>` : ''}
      `;

      bc.innerHTML = `
        <a href="index.html">${i18n.t('nav.home')}</a>
        <span class="sep">›</span>
        <span>${title}</span>
      `;
    }

    function updateCategorySEO(title, description) {
      const url = window.location.href.split('#')[0];
      const desc = description || `Découvrez ${title.toLowerCase()} chez Collection By Ibtissam — mode féminine contemporaine, livraison en Algérie.`;
      const set = (id, attr, val) => {
        const el = document.getElementById(id);
        if (el && val != null) el.setAttribute(attr, val);
      };
      set('canonical-link', 'href', url);
      set('meta-description', 'content', desc);
      set('og-title', 'content', `${title} — Collection By Ibtissam`);
      set('og-description', 'content', desc);
      set('og-url', 'content', url);

      const oldBc = document.getElementById('ld-breadcrumb');
      if (oldBc) oldBc.remove();
      const s = document.createElement('script');
      s.id = 'ld-breadcrumb';
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify({
        '@context': 'https://schema.org/',
        '@type': 'BreadcrumbList',
        itemListElement: [
          { '@type': 'ListItem', position: 1, name: i18n.t('nav.home'), item: 'https://collectionbyibtissam.com/' },
          { '@type': 'ListItem', position: 2, name: title }
        ]
      });
      document.head.appendChild(s);
    }

    function renderFilters() {
      const container = document.getElementById('category-filters');

      // Show category chips only when not viewing a specific category
      if (currentCategory) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = `
        <button class="filter-chip ${!currentFilter && !currentCategory ? 'active' : ''}" onclick="filterBy(null)">${i18n.t('general.all')}</button>
        ${allCategories.map(cat => `
          <button class="filter-chip" onclick="filterByCategory('${cat.slug}')">${i18n.field(cat, 'name')}</button>
        `).join('')}
      `;
    }

    async function loadProducts() {
      showLoading('products-grid');

      const filters = { sort: currentSort };

      if (currentCategory) {
        filters.category_id = currentCategory.id;
      } else if (currentFilter === 'new') {
        filters.is_new_arrival = true;
      } else if (currentFilter === 'sale') {
        filters.has_sale = true;
      } else if (currentFilter === 'best') {
        filters.is_best_seller = true;
      } else if (currentFilter === 'featured') {
        filters.is_featured = true;
      }

      try {
        const products = await store.getProducts(filters);
        renderProductGrid('products-grid', products);

        const countEl = document.getElementById('product-count');
        countEl.textContent = `${products.length} ${i18n.t('cart.items')}`;

        if (products.length === 0) {
          document.getElementById('products-grid').innerHTML = `
            <div class="cart-empty" style="grid-column: 1/-1">
              <p>${i18n.t('general.no_results')}</p>
              <a href="index.html" class="btn btn-primary">${i18n.t('cart.continue')}</a>
            </div>
          `;
        }
      } catch (e) {
        console.error('Failed to load products:', e);
      }
    }

    function sortProducts(sort) {
      currentSort = sort;
      loadProducts();
    }

    function filterBy(filter) {
      currentFilter = filter;
      currentCategory = null;
      window.history.replaceState({}, '', filter ? `category.html?filter=${filter}` : 'category.html');
      renderPageHeader();
      renderFilters();
      loadProducts();
    }

    function filterByCategory(slug) {
      window.location.href = `category.html?slug=${slug}`;
    }

    function renderPage() {
      renderHeader('categories');
      renderFooter();
      renderWhatsAppFAB();
      loadPage();
    }

    document.addEventListener('DOMContentLoaded', renderPage);
  </script>
</body>
</html>
