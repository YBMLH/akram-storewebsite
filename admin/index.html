<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Collection By Ibtissam — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cbi_admin_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-admin-theme', theme);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content" id="admin-content">
        <!-- Low stock alert banner -->
        <div id="low-stock-widget"></div>

        <!-- New orders alert banner -->
        <div id="new-orders-widget"></div>

        <!-- Stats -->
        <div class="stats-grid" id="stats-grid"></div>

        <!-- Recent Orders & Popular Products -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="admin-card">
            <div class="admin-card-header">
              <h2>${'Commandes Récentes'}</h2>
              <a href="orders.html" class="btn btn-sm btn-outline">Voir tout</a>
            </div>
            <div class="table-overflow">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Client</th>
                    <th>Total</th>
                    <th>Statut</th>
                  </tr>
                </thead>
                <tbody id="recent-orders"></tbody>
              </table>
            </div>
          </div>

          <div class="admin-card">
            <div class="admin-card-header">
              <h2>${'Produits Populaires'}</h2>
              <a href="products.html" class="btn btn-sm btn-outline">Voir tout</a>
            </div>
            <div class="table-overflow">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Produit</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>Vues</th>
                  </tr>
                </thead>
                <tbody id="popular-products"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    async function loadDashboard() {
      if (!await checkAdminAuth()) return;

      renderAdminSidebar('dashboard');
      renderAdminTopbar(i18n.t('admin.dashboard'));

      // Load stats
      try {
        const stats = await store.getDashboardStats();
        document.getElementById('stats-grid').innerHTML = `
          <div class="stat-card">
            <div class="stat-icon orders">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div class="stat-info">
              <h3>${i18n.currentLang === 'ar' ? 'طلبات اليوم' : 'Commandes Aujourd\'hui'}</h3>
              <div class="stat-value">${stats.todayOrders}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon sales">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <div class="stat-info">
              <h3>${i18n.currentLang === 'ar' ? 'مبيعات الشهر' : 'Ventes du Mois'}</h3>
              <div class="stat-value">${i18n.formatPrice(stats.monthlySales)}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon products">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            </div>
            <div class="stat-info">
              <h3>${i18n.currentLang === 'ar' ? 'المنتجات' : 'Produits'}</h3>
              <div class="stat-value">${stats.totalProducts}</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon alerts">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="stat-info">
              <h3>${i18n.currentLang === 'ar' ? 'مخزون منخفض' : 'Stock Faible'}</h3>
              <div class="stat-value">${stats.lowStockCount}</div>
            </div>
          </div>
        `;
      } catch (e) {
        console.error('Failed to load stats:', e);
      }

      // Load recent orders
      try {
        const orders = await store.getOrders({ limit: 5 });
        const newOrders = orders.filter(o => o.status === 'new');
        if (newOrders.length) {
          document.getElementById('new-orders-widget').innerHTML = `
            <div class="alert-widget" style="background:linear-gradient(135deg, rgba(0,122,255,0.08), rgba(90,200,250,0.04));border-color:rgba(0,122,255,0.2);">
              <div class="alert-widget-icon" style="background:rgba(0,122,255,0.2);color:var(--admin-primary);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              </div>
              <div class="alert-widget-content">
                <strong>${newOrders.length} nouvelle${newOrders.length > 1 ? 's' : ''} commande${newOrders.length > 1 ? 's' : ''}</strong>
                <p>À contacter et confirmer</p>
              </div>
              <a href="/admin/orders.html" class="btn btn-primary btn-sm">Voir →</a>
            </div>
          `;
        }
        document.getElementById('recent-orders').innerHTML = orders.slice(0, 5).map(order => `
          <tr onclick="window.location.href='/admin/orders.html'" style="cursor:pointer;">
            <td><strong>#${order.order_number}</strong></td>
            <td>${order.customer_name}</td>
            <td>${i18n.formatPrice(order.total_amount)}</td>
            <td>${getStatusLabel(order.status)}</td>
          </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--admin-text-muted);">Aucune commande</td></tr>';
      } catch (e) {
        console.error('Failed to load recent orders:', e);
      }

      // Load low stock
      try {
        const allProducts = await store.getProducts({});
        const lowStock = allProducts.filter(p => p.status === 'active' && p.stock_quantity <= (p.low_stock_threshold || 5));
        if (lowStock.length) {
          document.getElementById('low-stock-widget').innerHTML = `
            <div class="alert-widget">
              <div class="alert-widget-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              <div class="alert-widget-content">
                <strong>${lowStock.length} produit${lowStock.length > 1 ? 's' : ''} en stock faible</strong>
                <p>${lowStock.slice(0, 3).map(p => i18n.field(p, 'name') + ` (${p.stock_quantity})`).join(' · ')}${lowStock.length > 3 ? '…' : ''}</p>
              </div>
              <a href="/admin/products.html" class="btn btn-outline btn-sm">Gérer →</a>
            </div>
          `;
        }
      } catch (e) { console.warn(e); }

      // Load popular products
      try {
        const products = await store.getProducts({ sort: 'popular', limit: 5 });
        document.getElementById('popular-products').innerHTML = products.map(p => {
          const stockClass = p.stock_quantity <= 0 ? 'color:var(--color-danger)' :
                           p.stock_quantity <= 5 ? 'color:var(--color-warning)' : '';
          return `
            <tr>
              <td>${i18n.field(p, 'name')}</td>
              <td>${i18n.formatPrice(p.sale_price || p.base_price)}</td>
              <td style="${stockClass}">${p.stock_quantity}</td>
              <td>${p.views_count}</td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error('Failed to load popular products:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
