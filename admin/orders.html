<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Commandes — Collection By Ibtissam Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <!-- Toolbar: search + date filter + export -->
        <div class="admin-card" style="margin-bottom:12px;">
          <div class="admin-card-body" style="padding:16px 20px;">
            <div style="display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;align-items:end;flex-wrap:wrap;">
              <div class="form-group" style="margin:0;">
                <label>Recherche</label>
                <input type="search" id="search" placeholder="Nom, téléphone, wilaya, #numéro..." oninput="applyFilters()">
              </div>
              <div class="form-group" style="margin:0;">
                <label>Du</label>
                <input type="date" id="date-from" onchange="applyFilters()">
              </div>
              <div class="form-group" style="margin:0;">
                <label>Au</label>
                <input type="date" id="date-to" onchange="applyFilters()">
              </div>
              <button type="button" class="btn btn-outline btn-sm" onclick="clearFilters()">Réinitialiser</button>
              <button type="button" class="btn btn-primary btn-sm" onclick="exportCSV()">↓ Exporter CSV</button>
            </div>
          </div>
        </div>

        <!-- Status filter chips -->
        <div class="category-filters" id="order-filters" style="margin-bottom: 16px;"></div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h2>Commandes <span id="count-badge" style="color:var(--color-text-muted);font-weight:400;font-size:0.875rem;"></span></h2>
          </div>
          <div class="table-overflow">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Client</th>
                  <th>Téléphone</th>
                  <th>Wilaya</th>
                  <th>Total</th>
                  <th>Statut</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="orders-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Order Detail Modal -->
  <div id="order-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:24px;">
    <div style="background:white;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;" id="order-modal-content"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let allOrders = [];
    let currentStatusFilter = null;

    async function loadOrders() {
      if (!await checkAdminAuth()) return;
      renderAdminSidebar('orders');
      renderAdminTopbar(i18n.t('admin.orders'));
      renderFilters();
      allOrders = await store.getOrders();
      applyFilters();
    }

    function renderFilters() {
      const statuses = ['new', 'contacted', 'confirmed', 'preparing', 'shipped', 'delivered', 'cancelled'];
      document.getElementById('order-filters').innerHTML = `
        <button class="filter-chip ${!currentStatusFilter ? 'active' : ''}" onclick="setStatus(null)">${i18n.t('general.all')}</button>
        ${statuses.map(s => {
          const label = ORDER_STATUSES[s];
          return `<button class="filter-chip ${currentStatusFilter === s ? 'active' : ''}" onclick="setStatus('${s}')">${i18n.currentLang === 'ar' ? label.ar : label.fr}</button>`;
        }).join('')}
      `;
    }

    function setStatus(s) {
      currentStatusFilter = s;
      renderFilters();
      applyFilters();
    }

    function clearFilters() {
      document.getElementById('search').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      currentStatusFilter = null;
      renderFilters();
      applyFilters();
    }

    function getFiltered() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const from = document.getElementById('date-from').value;
      const to = document.getElementById('date-to').value;
      const fromDate = from ? new Date(from) : null;
      const toDate = to ? new Date(to + 'T23:59:59') : null;

      return allOrders.filter(o => {
        if (currentStatusFilter && o.status !== currentStatusFilter) return false;
        if (fromDate && new Date(o.created_at) < fromDate) return false;
        if (toDate && new Date(o.created_at) > toDate) return false;
        if (q) {
          const hay = `${o.order_number} ${o.customer_name} ${o.customer_phone} ${o.wilaya} ${o.commune || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function applyFilters() {
      const filtered = getFiltered();
      document.getElementById('count-badge').textContent = filtered.length ? `— ${filtered.length}` : '';

      const tbody = document.getElementById('orders-table');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:#999;">Aucun résultat</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(order => `
        <tr>
          <td><strong>#${order.order_number}</strong></td>
          <td>${order.customer_name}</td>
          <td><a href="tel:${order.customer_phone}">${order.customer_phone}</a></td>
          <td>${order.wilaya}</td>
          <td><strong>${i18n.formatPrice(order.total_amount)}</strong></td>
          <td>
            <select onchange="updateStatus('${order.id}', this.value)" style="padding:4px 8px;border:1px solid var(--admin-border);font-size:0.8125rem;">
              ${Object.entries(ORDER_STATUSES).map(([key, val]) => `
                <option value="${key}" ${order.status === key ? 'selected' : ''}>${i18n.currentLang === 'ar' ? val.ar : val.fr}</option>
              `).join('')}
            </select>
          </td>
          <td style="font-size:0.8125rem;white-space:nowrap;">${i18n.formatDate(order.created_at)}</td>
          <td>
            <div class="table-actions">
              <button class="table-action" onclick="viewOrder('${order.id}')" title="Voir">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button class="table-action" onclick="sendWhatsApp('${order.customer_phone}', '${order.customer_name.replace(/'/g, "\\'")}')" title="WhatsApp">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
              </button>
              <button class="table-action" onclick="printOrder('${order.id}')" title="Imprimer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(orderId, status) {
      try {
        await store.updateOrderStatus(orderId, status);
        const o = allOrders.find(x => x.id === orderId);
        if (o) o.status = status;
      } catch (e) {
        console.error(e);
        alert('Erreur mise à jour du statut');
        allOrders = await store.getOrders();
        applyFilters();
      }
    }

    function viewOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;
      const modal = document.getElementById('order-modal');
      const content = document.getElementById('order-modal-content');
      const items = order.items || [];
      const itemsHtml = items.length ? items.map(it => `
        <tr>
          <td><img src="${it.image_url || 'https://placehold.co/48x48/f7f5f1/8c8c8c?text=—'}" style="width:48px;height:48px;object-fit:cover;"></td>
          <td>${it.product_name_fr || it.product_name_ar || '—'}<br><small style="color:var(--color-text-muted);">${[it.size, it.color].filter(Boolean).join(' · ')}</small></td>
          <td style="text-align:center;">${it.quantity}</td>
          <td style="text-align:end;">${i18n.formatPrice(it.unit_price)}</td>
          <td style="text-align:end;"><strong>${i18n.formatPrice(it.unit_price * it.quantity)}</strong></td>
        </tr>
      `).join('') : '<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--color-text-muted);">Détail des articles non disponible en mode démo</td></tr>';

      content.innerHTML = `
        <div style="padding:20px 24px;border-bottom:1px solid var(--admin-border);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h2 style="margin:0;">Commande #${order.order_number}</h2>
            <div style="font-size:0.8125rem;color:var(--color-text-muted);margin-top:4px;">${i18n.formatDate(order.created_at)}</div>
          </div>
          <button onclick="closeOrderModal()" style="font-size:1.25rem;cursor:pointer;background:none;border:none;color:var(--color-text-muted);">×</button>
        </div>
        <div style="padding:20px 24px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
            <div>
              <div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Client</div>
              <div style="font-weight:600;">${order.customer_name}</div>
              <div style="font-size:0.875rem;color:var(--color-text-secondary);">${order.customer_phone}</div>
            </div>
            <div>
              <div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Livraison</div>
              <div style="font-size:0.875rem;line-height:1.5;">
                ${order.address}<br>
                ${order.commune ? order.commune + ', ' : ''}${order.wilaya}
              </div>
            </div>
            <div>
              <div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Statut</div>
              ${getStatusLabel(order.status)}
            </div>
            <div>
              <div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Total</div>
              <div style="font-weight:700;font-size:1.125rem;">${i18n.formatPrice(order.total_amount)}</div>
            </div>
          </div>

          ${order.notes ? `<div style="padding:12px 16px;background:var(--admin-bg);margin-bottom:24px;"><div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:4px;">Notes</div>${order.notes}</div>` : ''}

          <div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Articles</div>
          <table class="admin-table" style="margin-bottom:20px;">
            <thead><tr><th></th><th>Produit</th><th style="text-align:center;">Qté</th><th style="text-align:end;">Prix U.</th><th style="text-align:end;">Total</th></tr></thead>
            <tbody>${itemsHtml}</tbody>
          </table>

          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button class="btn btn-outline btn-sm" onclick="closeOrderModal()">Fermer</button>
            <button class="btn btn-outline btn-sm" onclick="sendWhatsApp('${order.customer_phone}', '${order.customer_name.replace(/'/g, "\\'")}')">WhatsApp</button>
            <button class="btn btn-primary btn-sm" onclick="printOrder('${order.id}')">Imprimer facture</button>
          </div>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('order-modal').style.display = 'none';
    }

    function sendWhatsApp(phone, name) {
      const intPhone = phone.replace(/^0/, '213');
      const message = i18n.currentLang === 'ar'
        ? `مرحباً ${name}، بخصوص طلبك من مجموعة إبتسام...`
        : `Bonjour ${name}, concernant votre commande chez Collection By Ibtissam...`;
      window.open(`https://wa.me/${intPhone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function printOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;
      const items = order.items || [];
      const storeName = i18n.currentLang === 'ar' ? STORE_CONFIG.store.name.ar : STORE_CONFIG.store.name.fr;
      const win = window.open('', '_blank', 'width=800,height=900');
      win.document.write(`
        <!DOCTYPE html><html><head><meta charset="UTF-8"><title>Facture #${order.order_number}</title>
        <style>
          @page { margin: 20mm; }
          body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #111; padding: 20px; max-width: 720px; margin: 0 auto; }
          .brand { font-family: Georgia, serif; font-size: 24px; letter-spacing: 2px; margin-bottom: 4px; }
          .brand-sub { font-size: 10px; letter-spacing: 4px; color: #666; text-transform: uppercase; }
          .header { border-bottom: 2px solid #111; padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
          .invoice-title { font-size: 14px; text-transform: uppercase; letter-spacing: 3px; }
          .invoice-no { font-size: 18px; font-weight: 700; margin-top: 4px; }
          .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
          .label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin-bottom: 4px; }
          table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
          th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #ddd; font-size: 13px; }
          th { text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: #666; font-weight: 600; }
          .right { text-align: right; }
          .center { text-align: center; }
          .total-row td { border-top: 2px solid #111; border-bottom: none; padding-top: 16px; font-size: 16px; font-weight: 700; }
          .notes { margin-top: 24px; padding: 12px; background: #f7f5f1; font-size: 13px; }
          .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #ddd; font-size: 11px; color: #666; text-align: center; }
          @media print { .no-print { display: none; } }
        </style></head><body>
        <div class="header">
          <div>
            <div class="brand">${storeName}</div>
            <div class="brand-sub">Boutique</div>
          </div>
          <div style="text-align:right;">
            <div class="invoice-title">Facture</div>
            <div class="invoice-no">#${order.order_number}</div>
            <div style="font-size:12px;color:#666;">${new Date(order.created_at).toLocaleString('fr-DZ')}</div>
          </div>
        </div>
        <div class="grid2">
          <div>
            <div class="label">Facturé à</div>
            <div style="font-weight:600;">${order.customer_name}</div>
            <div>${order.customer_phone}</div>
          </div>
          <div>
            <div class="label">Adresse de livraison</div>
            <div>${order.address}</div>
            <div>${order.commune ? order.commune + ', ' : ''}${order.wilaya}</div>
          </div>
        </div>
        <table>
          <thead><tr><th>Article</th><th class="center">Qté</th><th class="right">Prix</th><th class="right">Total</th></tr></thead>
          <tbody>
            ${items.length ? items.map(it => `
              <tr>
                <td>${it.product_name_fr || it.product_name_ar || '—'}<br><small style="color:#888;">${[it.size, it.color].filter(Boolean).join(' · ')}</small></td>
                <td class="center">${it.quantity}</td>
                <td class="right">${new Intl.NumberFormat('fr-DZ').format(it.unit_price)} DA</td>
                <td class="right">${new Intl.NumberFormat('fr-DZ').format(it.unit_price * it.quantity)} DA</td>
              </tr>
            `).join('') : '<tr><td colspan="4" style="text-align:center;color:#888;padding:20px;">Articles non détaillés</td></tr>'}
            <tr class="total-row">
              <td colspan="3" class="right">Total</td>
              <td class="right">${new Intl.NumberFormat('fr-DZ').format(order.total_amount)} DA</td>
            </tr>
          </tbody>
        </table>
        ${order.notes ? `<div class="notes"><div class="label">Notes</div>${order.notes}</div>` : ''}
        <div class="footer">
          ${storeName} · ${STORE_CONFIG.store.phone || ''} · ${STORE_CONFIG.store.address?.fr || 'Algérie'}<br>
          Merci pour votre commande.
        </div>
        <div class="no-print" style="margin-top:32px;text-align:center;">
          <button onclick="window.print()" style="padding:10px 24px;background:#111;color:#fff;border:none;cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-size:12px;">Imprimer</button>
        </div>
        </body></html>
      `);
      win.document.close();
    }

    function exportCSV() {
      const rows = getFiltered();
      if (!rows.length) return alert('Aucune commande à exporter.');
      const escape = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const header = ['Numéro', 'Date', 'Client', 'Téléphone', 'Wilaya', 'Commune', 'Adresse', 'Statut', 'Total (DA)', 'Notes'];
      const lines = [header.map(escape).join(',')];
      rows.forEach(o => lines.push([
        '#' + o.order_number,
        new Date(o.created_at).toISOString(),
        o.customer_name,
        o.customer_phone,
        o.wilaya,
        o.commune || '',
        o.address || '',
        o.status,
        o.total_amount,
        (o.notes || '').replace(/\r?\n/g, ' ')
      ].map(escape).join(',')));
      const csv = '\ufeff' + lines.join('\n'); // BOM for Excel UTF-8
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `commandes-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
    document.addEventListener('click', e => {
      if (e.target.id === 'order-modal') closeOrderModal();
    });
  </script>
</body>
</html>
