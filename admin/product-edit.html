<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Collection By Ibtissam — Modifier Produit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cbi_admin_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-admin-theme', theme);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-body">
            <form class="admin-form" id="product-form" onsubmit="saveProduct(event)">
              <!-- Bilingual names -->
              <div class="form-row">
                <div class="form-group">
                  <label>Nom (Français) *</label>
                  <input type="text" id="name_fr" required>
                </div>
                <div class="form-group">
                  <label>الاسم (عربي) *</label>
                  <input type="text" id="name_ar" dir="rtl">
                </div>
              </div>

              <!-- Slug -->
              <div class="form-group">
                <label>Slug (URL) *</label>
                <input type="text" id="slug" required pattern="[a-z0-9-]+" placeholder="caftan-royal-bleu">
              </div>

              <!-- Category -->
              <div class="form-group">
                <label>Catégorie</label>
                <select id="category_id">
                  <option value="">— Aucune —</option>
                </select>
              </div>

              <!-- Descriptions -->
              <div class="form-row">
                <div class="form-group">
                  <label>Description (Français)</label>
                  <textarea id="description_fr" rows="4"></textarea>
                </div>
                <div class="form-group">
                  <label>الوصف (عربي)</label>
                  <textarea id="description_ar" rows="4" dir="rtl"></textarea>
                </div>
              </div>

              <!-- Pricing -->
              <div class="form-row">
                <div class="form-group">
                  <label>Prix (DA) *</label>
                  <input type="number" id="base_price" required min="0" step="100">
                </div>
                <div class="form-group">
                  <label>Prix Promo (DA)</label>
                  <input type="number" id="sale_price" min="0" step="100" placeholder="Laisser vide si pas de promo">
                </div>
              </div>

              <!-- Stock -->
              <div class="form-row">
                <div class="form-group">
                  <label>Stock *</label>
                  <input type="number" id="stock_quantity" required min="0" value="0">
                </div>
                <div class="form-group">
                  <label>Seuil Stock Faible</label>
                  <input type="number" id="low_stock_threshold" min="0" value="5">
                </div>
              </div>

              <!-- Status -->
              <div class="form-group">
                <label>Statut</label>
                <select id="status">
                  <option value="active">Actif</option>
                  <option value="draft">Brouillon</option>
                  <option value="archived">Archivé</option>
                </select>
              </div>

              <!-- Flags -->
              <div style="display:flex;gap:24px;flex-wrap:wrap;">
                <label class="toggle-switch">
                  <input type="checkbox" id="is_featured">
                  <span class="toggle-track"></span>
                  Produit Vedette
                </label>
                <label class="toggle-switch">
                  <input type="checkbox" id="is_new_arrival">
                  <span class="toggle-track"></span>
                  Nouveauté
                </label>
                <label class="toggle-switch">
                  <input type="checkbox" id="is_best_seller">
                  <span class="toggle-track"></span>
                  Best Seller
                </label>
              </div>

              <!-- Images with upload -->
              <div class="form-group">
                <label>Images <span class="help-tip" data-tip="Glissez-déposez des images ou cliquez pour en choisir depuis votre appareil. La première image sera l'image principale.">?</span></label>
                <div class="image-upload-area" id="image-dropzone">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  <p style="margin-top:8px;"><strong>Cliquez</strong> ou <strong>glissez-déposez</strong> vos images</p>
                  <p style="font-size:0.75rem;color:var(--admin-text-muted);">PNG, JPG, WebP · Plusieurs images acceptées</p>
                </div>
                <div id="image-previews" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));gap:10px;margin-top:14px;"></div>
                <details style="margin-top:12px;">
                  <summary style="cursor:pointer;font-size:0.8125rem;color:var(--admin-text-muted);">Ou coller des URLs d'images (avancé)</summary>
                  <textarea id="image_urls_manual" rows="3" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg" oninput="syncManualUrls()" style="margin-top:8px;"></textarea>
                </details>
              </div>

              <!-- SEO Fields -->
              <details style="border:1px solid var(--admin-border);padding:16px;">
                <summary style="cursor:pointer;font-weight:500;font-size:0.875rem;">SEO — Référencement Google</summary>
                <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px;">
                  <div class="form-group">
                    <label>Meta description (FR) <small style="color:var(--color-text-muted);">— 155 caractères max</small></label>
                    <textarea id="seo_description_fr" rows="2" maxlength="160" placeholder="Description courte pour Google (utilise la description du produit si vide)"></textarea>
                  </div>
                  <div class="form-group">
                    <label>الوصف الوصفي (AR)</label>
                    <textarea id="seo_description_ar" rows="2" maxlength="160" dir="rtl"></textarea>
                  </div>
                </div>
              </details>

              <!-- Variants: pick sizes + pick colors, grid auto-generates -->
              <div class="form-group" style="border:1px solid var(--admin-border);padding:16px;border-radius:8px;">
                <label style="font-weight:600;margin-bottom:12px;display:block;">Tailles & Couleurs</label>

                <!-- Sizes -->
                <div style="margin-bottom:16px;">
                  <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Tailles disponibles</div>
                  <div id="size-checks" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;"></div>
                  <div style="display:flex;gap:6px;align-items:center;">
                    <input type="text" id="custom-size-input" placeholder="Ajouter (ex: 42, 44)" style="flex:1;max-width:200px;padding:6px 10px;border:1px solid var(--admin-border);border-radius:6px;font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);">
                    <button type="button" class="btn btn-outline btn-sm" onclick="addCustomSize()">+ Ajouter</button>
                  </div>
                </div>

                <!-- Colors -->
                <div style="margin-bottom:16px;padding-top:16px;border-top:1px solid var(--admin-border);">
                  <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Couleurs disponibles</div>
                  <div id="color-list" style="display:flex;gap:6px;flex-direction:column;margin-bottom:8px;"></div>
                  <button type="button" class="btn btn-outline btn-sm" onclick="addColorRow()">+ Ajouter une couleur</button>
                </div>

                <!-- Auto-generated stock & price grid -->
                <div id="combo-section" style="padding-top:16px;border-top:1px solid var(--admin-border);display:none;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);">Stock & prix par variante</div>
                    <button type="button" class="btn btn-outline btn-sm" onclick="applyBulkStock()">Appliquer stock à toutes</button>
                  </div>
                  <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <input type="number" id="bulk-stock-input" min="0" placeholder="Stock" style="width:120px;padding:6px 10px;border:1px solid var(--admin-border);border-radius:6px;font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);">
                    <input type="number" id="bulk-price-input" min="0" step="50" placeholder="Prix (optionnel)" style="width:160px;padding:6px 10px;border:1px solid var(--admin-border);border-radius:6px;font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);">
                    <button type="button" class="btn btn-outline btn-sm" onclick="applyBulkPrice()">Appliquer prix</button>
                  </div>
                  <div id="combo-grid" style="overflow-x:auto;"></div>
                </div>
                <div id="combo-empty" style="padding:12px;color:var(--color-text-muted);font-size:0.8125rem;">
                  Cochez des tailles et/ou ajoutez des couleurs pour générer les variantes.
                </div>
              </div>

              <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="products.html" class="btn btn-outline">Annuler</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let editingProduct = null;
    let variantCount = 0;
    let productImages = []; // array of image URLs

    async function loadPage() {
      if (!await checkAdminAuth()) return;

      renderAdminSidebar('products');

      // Load categories for dropdown
      const categories = await store.getCategories();
      const catSelect = document.getElementById('category_id');
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${i18n.field(cat, 'name')}`;
        catSelect.appendChild(opt);
      });

      // Check if editing existing product
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (id) {
        renderAdminTopbar(i18n.currentLang === 'ar' ? 'تعديل المنتج' : 'Modifier le Produit');
        await loadExistingProduct(id);
      } else {
        renderAdminTopbar(i18n.currentLang === 'ar' ? 'إضافة منتج جديد' : 'Ajouter un Produit');
        renderSizeChecks();
        renderColorList();
        renderCombos();
      }

      // Auto-generate slug from French name
      document.getElementById('name_fr').addEventListener('input', function() {
        if (!editingProduct) {
          document.getElementById('slug').value = this.value
            .toLowerCase()
            .replace(/[éèê]/g, 'e')
            .replace(/[àâ]/g, 'a')
            .replace(/[ùû]/g, 'u')
            .replace(/[ïî]/g, 'i')
            .replace(/[ôö]/g, 'o')
            .replace(/ç/g, 'c')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/(^-|-$)/g, '');
        }
      });

      // Attach image upload to drop zone
      const dropzone = document.getElementById('image-dropzone');
      initImageUpload(dropzone, (url) => {
        productImages.push(url);
        renderImagePreviews();
      }, { folder: 'products', multiple: true });
    }

    function syncManualUrls() {
      const text = document.getElementById('image_urls_manual').value;
      const urls = text.split('\n').map(s => s.trim()).filter(Boolean);
      productImages = urls;
      renderImagePreviews();
    }

    function removeImage(index) {
      productImages.splice(index, 1);
      renderImagePreviews();
    }

    function makeImagePrimary(index) {
      if (index === 0) return;
      const [img] = productImages.splice(index, 1);
      productImages.unshift(img);
      renderImagePreviews();
    }

    async function loadExistingProduct(id) {
      // In demo mode, find from demo data
      const products = await store.getProducts({});
      editingProduct = products.find(p => p.id === id);
      if (!editingProduct) return;

      const p = editingProduct;
      document.getElementById('name_fr').value = p.name_fr;
      document.getElementById('name_ar').value = p.name_ar;
      document.getElementById('slug').value = p.slug;
      document.getElementById('category_id').value = p.category_id || '';
      document.getElementById('description_fr').value = p.description_fr || '';
      document.getElementById('description_ar').value = p.description_ar || '';
      document.getElementById('base_price').value = p.base_price;
      document.getElementById('sale_price').value = p.sale_price || '';
      document.getElementById('stock_quantity').value = p.stock_quantity;
      document.getElementById('low_stock_threshold').value = p.low_stock_threshold || 5;
      document.getElementById('status').value = p.status;
      document.getElementById('is_featured').checked = p.is_featured;
      document.getElementById('is_new_arrival').checked = p.is_new_arrival;
      document.getElementById('is_best_seller').checked = p.is_best_seller;

      // Images
      if (p.images && p.images.length) {
        productImages = p.images
          .slice()
          .sort((a, b) => (a.is_primary ? -1 : b.is_primary ? 1 : 0))
          .map(i => i.image_url);
        renderImagePreviews();
      }

      // SEO
      const seoFr = document.getElementById('seo_description_fr');
      const seoAr = document.getElementById('seo_description_ar');
      if (seoFr) seoFr.value = p.seo_description_fr || '';
      if (seoAr) seoAr.value = p.seo_description_ar || '';

      // Variants
      hydrateVariants(p.variants || []);
    }

    function renderImagePreviews() {
      const container = document.getElementById('image-previews');
      if (!container) return;
      container.innerHTML = productImages.map((url, i) => `
        <div class="image-preview">
          ${url ? `<img src="${url}" alt="" onerror="this.outerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;background:#fee;color:#c00;font-size:0.6875rem;text-align:center;padding:6px;\\'>Image non chargée<br><a href=&quot;${url}&quot; target=_blank style=\\'color:#c00;text-decoration:underline;font-size:0.625rem;\\'>Ouvrir URL</a></div>';">`
                : '<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#fee;color:#c00;font-size:0.6875rem;text-align:center;padding:6px;">URL vide</div>'}
          ${i === 0
            ? '<span style="position:absolute;top:6px;left:6px;background:var(--admin-primary);color:#fff;font-size:0.625rem;padding:3px 7px;border-radius:var(--admin-radius-xs);font-weight:600;letter-spacing:0.5px;">PRINCIPAL</span>'
            : `<button type="button" onclick="makeImagePrimary(${i})" title="Définir comme image principale" style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.625rem;padding:3px 7px;border-radius:var(--admin-radius-xs);border:none;cursor:pointer;backdrop-filter:blur(4px);">★</button>`
          }
          <button type="button" class="image-preview-remove" onclick="removeImage(${i})" title="Supprimer">×</button>
        </div>
      `).join('');
      // Keep hidden manual textarea in sync for anyone switching to that mode
      const manual = document.getElementById('image_urls_manual');
      if (manual && document.activeElement !== manual) manual.value = productImages.join('\n');
    }

    // ---- Variant system: sizes checkbox + colors list + auto-grid ----
    const DEFAULT_SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
    let selectedSizes = new Set();     // Set of size strings
    let colors = [];                   // [{ name_fr, hex }]
    let combos = {};                   // { "size||color_name_fr": { stock, price } }

    function keyFor(size, color) {
      return `${size || ''}||${color || ''}`;
    }

    function renderSizeChecks() {
      // Collect every size that should appear: defaults + any custom ones already picked
      const all = new Set([...DEFAULT_SIZES, ...selectedSizes]);
      const container = document.getElementById('size-checks');
      container.innerHTML = Array.from(all).map(s => {
        const checked = selectedSizes.has(s);
        const isCustom = !DEFAULT_SIZES.includes(s);
        return `
          <label style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid ${checked ? 'var(--admin-primary)' : 'var(--admin-border)'};border-radius:999px;cursor:pointer;background:${checked ? 'var(--admin-primary)' : 'var(--admin-surface)'};color:${checked ? '#fff' : 'var(--admin-text)'};font-size:0.8125rem;">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSize('${s.replace(/'/g, "\\'")}', this.checked)" style="display:none;">
            ${s}${isCustom ? ` <span onclick="event.preventDefault(); removeCustomSize('${s.replace(/'/g, "\\'")}')" style="margin-inline-start:4px;opacity:0.7;cursor:pointer;">×</span>` : ''}
          </label>
        `;
      }).join('');
    }

    function toggleSize(size, checked) {
      if (checked) selectedSizes.add(size);
      else selectedSizes.delete(size);
      renderSizeChecks();
      renderCombos();
    }

    function addCustomSize() {
      const input = document.getElementById('custom-size-input');
      const raw = input.value.trim();
      if (!raw) return;
      // Allow comma-separated list in one go: "42, 44, 46" -> three chips
      raw.split(/[,;]+/).map(s => s.trim()).filter(Boolean).forEach(s => selectedSizes.add(s));
      input.value = '';
      renderSizeChecks();
      renderCombos();
    }

    function removeCustomSize(size) {
      selectedSizes.delete(size);
      renderSizeChecks();
      renderCombos();
    }

    function renderColorList() {
      const container = document.getElementById('color-list');
      if (!colors.length) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = colors.map((c, i) => `
        <div style="display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--admin-bg);border-radius:6px;">
          <input type="color" value="${c.hex}" onchange="colors[${i}].hex=this.value; renderCombos();" style="height:34px;width:50px;border:1px solid var(--admin-border);border-radius:4px;padding:2px;">
          <input type="text" value="${c.name_fr}" placeholder="Nom (ex: Bleu nuit)" oninput="colors[${i}].name_fr=this.value; renderCombos();" style="flex:1;padding:6px 10px;border:1px solid var(--admin-border);border-radius:6px;font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);">
          <button type="button" onclick="colors.splice(${i}, 1); renderColorList(); renderCombos();" style="background:transparent;border:none;color:var(--color-danger);font-size:1.25rem;cursor:pointer;padding:0 6px;">×</button>
        </div>
      `).join('');
    }

    function addColorRow(data) {
      colors.push(data || { name_fr: '', hex: '#000000' });
      renderColorList();
      renderCombos();
    }

    function renderCombos() {
      const sizes = Array.from(selectedSizes);
      const cols = colors.filter(c => c.name_fr.trim());
      const empty = document.getElementById('combo-empty');
      const section = document.getElementById('combo-section');
      const grid = document.getElementById('combo-grid');

      if (!sizes.length && !cols.length) {
        empty.style.display = 'block';
        section.style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      section.style.display = 'block';

      // Build the combination list
      const rows = [];
      if (sizes.length && cols.length) {
        sizes.forEach(s => cols.forEach(c => rows.push({ size: s, color: c.name_fr, hex: c.hex })));
      } else if (sizes.length) {
        sizes.forEach(s => rows.push({ size: s, color: '', hex: '' }));
      } else {
        cols.forEach(c => rows.push({ size: '', color: c.name_fr, hex: c.hex }));
      }

      grid.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:0.8125rem;">
          <thead>
            <tr style="background:var(--admin-bg);">
              ${sizes.length ? '<th style="text-align:start;padding:8px 10px;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);">Taille</th>' : ''}
              ${cols.length ? '<th style="text-align:start;padding:8px 10px;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);">Couleur</th>' : ''}
              <th style="text-align:start;padding:8px 10px;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);width:120px;">Stock</th>
              <th style="text-align:start;padding:8px 10px;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);width:160px;">Prix (optionnel)</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => {
              const k = keyFor(r.size, r.color);
              const prev = combos[k] || {};
              return `
                <tr>
                  ${sizes.length ? `<td style="padding:6px 10px;border-top:1px solid var(--admin-border);font-weight:500;">${r.size || '—'}</td>` : ''}
                  ${cols.length ? `<td style="padding:6px 10px;border-top:1px solid var(--admin-border);"><span style="display:inline-block;width:14px;height:14px;background:${r.hex || '#ccc'};border-radius:50%;vertical-align:middle;border:1px solid rgba(0,0,0,0.1);margin-inline-end:6px;"></span>${r.color || '—'}</td>` : ''}
                  <td style="padding:6px 10px;border-top:1px solid var(--admin-border);">
                    <input type="number" min="0" value="${prev.stock ?? 0}" data-combo="${k}" data-field="stock"
                      style="width:100%;padding:5px 8px;border:1px solid var(--admin-border);border-radius:4px;font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);">
                  </td>
                  <td style="padding:6px 10px;border-top:1px solid var(--admin-border);">
                    <input type="number" min="0" step="50" value="${prev.price > 0 ? prev.price : ''}" placeholder="—" data-combo="${k}" data-field="price"
                      style="width:100%;padding:5px 8px;border:1px solid var(--admin-border);border-radius:4px;font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);">
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;

      // Wire inputs → combos object
      grid.querySelectorAll('input[data-combo]').forEach(el => {
        el.addEventListener('input', () => {
          const k = el.dataset.combo;
          if (!combos[k]) combos[k] = { stock: 0, price: 0 };
          const num = parseFloat(el.value) || 0;
          combos[k][el.dataset.field] = Math.max(0, num);
        });
      });
    }

    function applyBulkStock() {
      const v = parseInt(document.getElementById('bulk-stock-input').value, 10);
      if (isNaN(v) || v < 0) return;
      document.querySelectorAll('#combo-grid input[data-field="stock"]').forEach(el => {
        el.value = v;
        const k = el.dataset.combo;
        if (!combos[k]) combos[k] = { stock: 0, price: 0 };
        combos[k].stock = v;
      });
    }

    function applyBulkPrice() {
      const v = parseFloat(document.getElementById('bulk-price-input').value);
      if (isNaN(v) || v < 0) return;
      document.querySelectorAll('#combo-grid input[data-field="price"]').forEach(el => {
        el.value = v || '';
        const k = el.dataset.combo;
        if (!combos[k]) combos[k] = { stock: 0, price: 0 };
        combos[k].price = v;
      });
    }

    // Load existing variants into the new UI when editing a product
    function hydrateVariants(variants) {
      selectedSizes = new Set();
      colors = [];
      combos = {};
      const seenColors = new Set();
      variants.forEach(v => {
        if (v.size) selectedSizes.add(v.size);
        if (v.color_name_fr && !seenColors.has(v.color_name_fr)) {
          seenColors.add(v.color_name_fr);
          colors.push({ name_fr: v.color_name_fr, hex: v.color_hex || '#000000' });
        }
        combos[keyFor(v.size, v.color_name_fr)] = {
          stock: v.stock_quantity || 0,
          price: v.price_adjustment > 0 ? v.price_adjustment : 0,
        };
      });
      renderSizeChecks();
      renderColorList();
      renderCombos();
    }

    function collectVariants() {
      const sizes = Array.from(selectedSizes);
      const cols = colors.filter(c => c.name_fr.trim());
      const out = [];
      const push = (size, color, hex) => {
        const k = keyFor(size, color);
        const c = combos[k] || { stock: 0, price: 0 };
        out.push({
          size: size || '',
          color_name_fr: color || '',
          color_hex: hex || '#000000',
          stock_quantity: c.stock || 0,
          price_adjustment: c.price > 0 ? c.price : 0,
          is_active: true,
        });
      };
      if (sizes.length && cols.length) {
        sizes.forEach(s => cols.forEach(c => push(s, c.name_fr, c.hex)));
      } else if (sizes.length) {
        sizes.forEach(s => push(s, '', ''));
      } else if (cols.length) {
        cols.forEach(c => push('', c.name_fr, c.hex));
      }
      return out.filter(v => v.size || v.color_name_fr);
    }

    async function saveProduct(e) {
      e.preventDefault();

      const images = productImages.map((url, i) => ({ image_url: url, is_primary: i === 0, sort_order: i }));

      const variants = collectVariants();

      const productData = {
        name_fr: document.getElementById('name_fr').value,
        name_ar: document.getElementById('name_ar').value,
        slug: document.getElementById('slug').value,
        category_id: document.getElementById('category_id').value || null,
        description_fr: document.getElementById('description_fr').value,
        description_ar: document.getElementById('description_ar').value,
        seo_description_fr: document.getElementById('seo_description_fr')?.value || '',
        seo_description_ar: document.getElementById('seo_description_ar')?.value || '',
        base_price: parseFloat(document.getElementById('base_price').value),
        sale_price: document.getElementById('sale_price').value ? parseFloat(document.getElementById('sale_price').value) : null,
        stock_quantity: parseInt(document.getElementById('stock_quantity').value),
        low_stock_threshold: parseInt(document.getElementById('low_stock_threshold').value),
        status: document.getElementById('status').value,
        is_featured: document.getElementById('is_featured').checked,
        is_new_arrival: document.getElementById('is_new_arrival').checked,
        is_best_seller: document.getElementById('is_best_seller').checked,
        images,
        variants,
      };

      try {
        if (editingProduct) {
          await store.updateProduct(editingProduct.id, productData);
        } else {
          await store.createProduct(productData);
        }

        showToast(i18n.currentLang === 'ar' ? 'تم الحفظ بنجاح' : 'Produit enregistré', 'success');
        setTimeout(() => { window.location.href = '/admin/products.html'; }, 600);
      } catch (e) {
        console.error('Failed to save product:', e);
        showToast('Erreur: ' + (e.message || 'Enregistrement échoué'), 'error', 5000);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPage);
  </script>
</body>
