<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Collection By Ibtissam — Modifier Produit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cbi_admin_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-admin-theme', theme);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-body">
            <form class="admin-form" id="product-form" onsubmit="saveProduct(event)">
              <!-- Bilingual names -->
              <div class="form-row">
                <div class="form-group">
                  <label>Nom (Français) *</label>
                  <input type="text" id="name_fr" required>
                </div>
                <div class="form-group">
                  <label>الاسم (عربي) *</label>
                  <input type="text" id="name_ar" required dir="rtl">
                </div>
              </div>

              <!-- Slug -->
              <div class="form-group">
                <label>Slug (URL) *</label>
                <input type="text" id="slug" required pattern="[a-z0-9-]+" placeholder="caftan-royal-bleu">
              </div>

              <!-- Category -->
              <div class="form-group">
                <label>Catégorie</label>
                <select id="category_id">
                  <option value="">— Aucune —</option>
                </select>
              </div>

              <!-- Descriptions -->
              <div class="form-row">
                <div class="form-group">
                  <label>Description (Français)</label>
                  <textarea id="description_fr" rows="4"></textarea>
                </div>
                <div class="form-group">
                  <label>الوصف (عربي)</label>
                  <textarea id="description_ar" rows="4" dir="rtl"></textarea>
                </div>
              </div>

              <!-- Pricing -->
              <div class="form-row">
                <div class="form-group">
                  <label>Prix (DA) *</label>
                  <input type="number" id="base_price" required min="0" step="100">
                </div>
                <div class="form-group">
                  <label>Prix Promo (DA)</label>
                  <input type="number" id="sale_price" min="0" step="100" placeholder="Laisser vide si pas de promo">
                </div>
              </div>

              <!-- Stock -->
              <div class="form-row">
                <div class="form-group">
                  <label>Stock *</label>
                  <input type="number" id="stock_quantity" required min="0" value="0">
                </div>
                <div class="form-group">
                  <label>Seuil Stock Faible</label>
                  <input type="number" id="low_stock_threshold" min="0" value="5">
                </div>
              </div>

              <!-- Status -->
              <div class="form-group">
                <label>Statut</label>
                <select id="status">
                  <option value="active">Actif</option>
                  <option value="draft">Brouillon</option>
                  <option value="archived">Archivé</option>
                </select>
              </div>

              <!-- Flags -->
              <div style="display:flex;gap:24px;flex-wrap:wrap;">
                <label class="toggle-switch">
                  <input type="checkbox" id="is_featured">
                  <span class="toggle-track"></span>
                  Produit Vedette
                </label>
                <label class="toggle-switch">
                  <input type="checkbox" id="is_new_arrival">
                  <span class="toggle-track"></span>
                  Nouveauté
                </label>
                <label class="toggle-switch">
                  <input type="checkbox" id="is_best_seller">
                  <span class="toggle-track"></span>
                  Best Seller
                </label>
              </div>

              <!-- Images with upload -->
              <div class="form-group">
                <label>Images <span class="help-tip" data-tip="Glissez-déposez des images ou cliquez pour en choisir depuis votre appareil. La première image sera l'image principale.">?</span></label>
                <div class="image-upload-area" id="image-dropzone">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                  <p style="margin-top:8px;"><strong>Cliquez</strong> ou <strong>glissez-déposez</strong> vos images</p>
                  <p style="font-size:0.75rem;color:var(--admin-text-muted);">PNG, JPG, WebP · Plusieurs images acceptées</p>
                </div>
                <div id="image-previews" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));gap:10px;margin-top:14px;"></div>
                <details style="margin-top:12px;">
                  <summary style="cursor:pointer;font-size:0.8125rem;color:var(--admin-text-muted);">Ou coller des URLs d'images (avancé)</summary>
                  <textarea id="image_urls_manual" rows="3" placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg" oninput="syncManualUrls()" style="margin-top:8px;"></textarea>
                </details>
              </div>

              <!-- SEO Fields -->
              <details style="border:1px solid var(--admin-border);padding:16px;">
                <summary style="cursor:pointer;font-weight:500;font-size:0.875rem;">SEO — Référencement Google</summary>
                <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px;">
                  <div class="form-group">
                    <label>Meta description (FR) <small style="color:var(--color-text-muted);">— 155 caractères max</small></label>
                    <textarea id="seo_description_fr" rows="2" maxlength="160" placeholder="Description courte pour Google (utilise la description du produit si vide)"></textarea>
                  </div>
                  <div class="form-group">
                    <label>الوصف الوصفي (AR)</label>
                    <textarea id="seo_description_ar" rows="2" maxlength="160" dir="rtl"></textarea>
                  </div>
                </div>
              </details>

              <!-- Variants -->
              <div class="form-group">
                <label>Variantes (Tailles & Couleurs)</label>
                <div id="variants-container"></div>
                <button type="button" class="btn btn-outline btn-sm" onclick="addVariantRow()" style="margin-top: 8px;">
                  + Ajouter une variante
                </button>
              </div>

              <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="products.html" class="btn btn-outline">Annuler</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let editingProduct = null;
    let variantCount = 0;
    let productImages = []; // array of image URLs

    async function loadPage() {
      if (!await checkAdminAuth()) return;

      renderAdminSidebar('products');

      // Load categories for dropdown
      const categories = await store.getCategories();
      const catSelect = document.getElementById('category_id');
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${i18n.field(cat, 'name')}`;
        catSelect.appendChild(opt);
      });

      // Check if editing existing product
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (id) {
        renderAdminTopbar(i18n.currentLang === 'ar' ? 'تعديل المنتج' : 'Modifier le Produit');
        await loadExistingProduct(id);
      } else {
        renderAdminTopbar(i18n.currentLang === 'ar' ? 'إضافة منتج جديد' : 'Ajouter un Produit');
        addVariantRow(); // Start with one empty variant
      }

      // Auto-generate slug from French name
      document.getElementById('name_fr').addEventListener('input', function() {
        if (!editingProduct) {
          document.getElementById('slug').value = this.value
            .toLowerCase()
            .replace(/[éèê]/g, 'e')
            .replace(/[àâ]/g, 'a')
            .replace(/[ùû]/g, 'u')
            .replace(/[ïî]/g, 'i')
            .replace(/[ôö]/g, 'o')
            .replace(/ç/g, 'c')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/(^-|-$)/g, '');
        }
      });

      // Attach image upload to drop zone
      const dropzone = document.getElementById('image-dropzone');
      initImageUpload(dropzone, (url) => {
        productImages.push(url);
        renderImagePreviews();
      }, { folder: 'products', multiple: true });
    }

    function syncManualUrls() {
      const text = document.getElementById('image_urls_manual').value;
      const urls = text.split('\n').map(s => s.trim()).filter(Boolean);
      productImages = urls;
      renderImagePreviews();
    }

    function removeImage(index) {
      productImages.splice(index, 1);
      renderImagePreviews();
    }

    function makeImagePrimary(index) {
      if (index === 0) return;
      const [img] = productImages.splice(index, 1);
      productImages.unshift(img);
      renderImagePreviews();
    }

    async function loadExistingProduct(id) {
      // In demo mode, find from demo data
      const products = await store.getProducts({});
      editingProduct = products.find(p => p.id === id);
      if (!editingProduct) return;

      const p = editingProduct;
      document.getElementById('name_fr').value = p.name_fr;
      document.getElementById('name_ar').value = p.name_ar;
      document.getElementById('slug').value = p.slug;
      document.getElementById('category_id').value = p.category_id || '';
      document.getElementById('description_fr').value = p.description_fr || '';
      document.getElementById('description_ar').value = p.description_ar || '';
      document.getElementById('base_price').value = p.base_price;
      document.getElementById('sale_price').value = p.sale_price || '';
      document.getElementById('stock_quantity').value = p.stock_quantity;
      document.getElementById('low_stock_threshold').value = p.low_stock_threshold || 5;
      document.getElementById('status').value = p.status;
      document.getElementById('is_featured').checked = p.is_featured;
      document.getElementById('is_new_arrival').checked = p.is_new_arrival;
      document.getElementById('is_best_seller').checked = p.is_best_seller;

      // Images
      if (p.images && p.images.length) {
        productImages = p.images
          .slice()
          .sort((a, b) => (a.is_primary ? -1 : b.is_primary ? 1 : 0))
          .map(i => i.image_url);
        renderImagePreviews();
      }

      // SEO
      const seoFr = document.getElementById('seo_description_fr');
      const seoAr = document.getElementById('seo_description_ar');
      if (seoFr) seoFr.value = p.seo_description_fr || '';
      if (seoAr) seoAr.value = p.seo_description_ar || '';

      // Variants
      if (p.variants && p.variants.length > 0) {
        p.variants.forEach(v => addVariantRow(v));
      } else {
        addVariantRow();
      }
    }

    function renderImagePreviews() {
      const container = document.getElementById('image-previews');
      if (!container) return;
      container.innerHTML = productImages.map((url, i) => `
        <div class="image-preview">
          <img src="${url}" onerror="this.style.opacity=0.2;">
          ${i === 0
            ? '<span style="position:absolute;top:6px;left:6px;background:var(--admin-primary);color:#fff;font-size:0.625rem;padding:3px 7px;border-radius:var(--admin-radius-xs);font-weight:600;letter-spacing:0.5px;">PRINCIPAL</span>'
            : `<button type="button" onclick="makeImagePrimary(${i})" title="Définir comme image principale" style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.6);color:#fff;font-size:0.625rem;padding:3px 7px;border-radius:var(--admin-radius-xs);border:none;cursor:pointer;backdrop-filter:blur(4px);">★</button>`
          }
          <button type="button" class="image-preview-remove" onclick="removeImage(${i})" title="Supprimer">×</button>
        </div>
      `).join('');
      // Keep hidden manual textarea in sync for anyone switching to that mode
      const manual = document.getElementById('image_urls_manual');
      if (manual && document.activeElement !== manual) manual.value = productImages.join('\n');
    }

    function addVariantRow(data = null) {
      variantCount++;
      const container = document.getElementById('variants-container');
      const row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 1fr 80px 40px;gap:8px;align-items:end;margin-bottom:8px;';
      row.innerHTML = `
        <div class="form-group">
          ${variantCount === 1 ? '<label>Taille</label>' : ''}
          <input type="text" value="${data?.size || ''}" placeholder="S, M, L, XL..." class="variant-size">
        </div>
        <div class="form-group">
          ${variantCount === 1 ? '<label>Couleur (FR)</label>' : ''}
          <input type="text" value="${data?.color_name_fr || ''}" placeholder="Bleu, Rouge..." class="variant-color-fr">
        </div>
        <div class="form-group">
          ${variantCount === 1 ? '<label>Hex</label>' : ''}
          <input type="color" value="${data?.color_hex || '#000000'}" class="variant-color-hex" style="height:38px;">
        </div>
        <div class="form-group">
          ${variantCount === 1 ? '<label>Stock</label>' : ''}
          <input type="number" value="${data?.stock_quantity || 0}" min="0" class="variant-stock">
        </div>
        <button type="button" onclick="this.parentElement.remove()" style="height:38px;color:var(--color-danger);font-size:1.25rem;cursor:pointer;${variantCount === 1 ? 'margin-top:22px;' : ''}">&times;</button>
      `;
      container.appendChild(row);
    }

    async function saveProduct(e) {
      e.preventDefault();

      const images = productImages.map((url, i) => ({ image_url: url, is_primary: i === 0, sort_order: i }));

      const variants = Array.from(document.querySelectorAll('#variants-container > div')).map(row => ({
        size: row.querySelector('.variant-size')?.value.trim() || '',
        color_name_fr: row.querySelector('.variant-color-fr')?.value.trim() || '',
        color_hex: row.querySelector('.variant-color-hex')?.value || '#000000',
        stock_quantity: parseInt(row.querySelector('.variant-stock')?.value) || 0,
        is_active: true,
      })).filter(v => v.size || v.color_name_fr);

      const productData = {
        name_fr: document.getElementById('name_fr').value,
        name_ar: document.getElementById('name_ar').value,
        slug: document.getElementById('slug').value,
        category_id: document.getElementById('category_id').value || null,
        description_fr: document.getElementById('description_fr').value,
        description_ar: document.getElementById('description_ar').value,
        seo_description_fr: document.getElementById('seo_description_fr')?.value || '',
        seo_description_ar: document.getElementById('seo_description_ar')?.value || '',
        base_price: parseFloat(document.getElementById('base_price').value),
        sale_price: document.getElementById('sale_price').value ? parseFloat(document.getElementById('sale_price').value) : null,
        stock_quantity: parseInt(document.getElementById('stock_quantity').value),
        low_stock_threshold: parseInt(document.getElementById('low_stock_threshold').value),
        status: document.getElementById('status').value,
        is_featured: document.getElementById('is_featured').checked,
        is_new_arrival: document.getElementById('is_new_arrival').checked,
        is_best_seller: document.getElementById('is_best_seller').checked,
        images,
        variants,
      };

      try {
        if (editingProduct) {
          await store.updateProduct(editingProduct.id, productData);
        } else {
          await store.createProduct(productData);
        }

        showToast(i18n.currentLang === 'ar' ? 'تم الحفظ بنجاح' : 'Produit enregistré', 'success');
        setTimeout(() => { window.location.href = '/admin/products.html'; }, 600);
      } catch (e) {
        console.error('Failed to save product:', e);
        showToast('Erreur: ' + (e.message || 'Enregistrement échoué'), 'error', 5000);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPage);
  </script>
</body>
</html>
