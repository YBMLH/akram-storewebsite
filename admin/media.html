<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Médiathèque — Collection By Ibtissam Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cbi_admin_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-admin-theme', theme);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">

        <div class="admin-card" style="margin-bottom:16px;">
          <div class="admin-card-body">
            <div class="image-upload-area" id="upload-area">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <p style="margin-top:8px;"><strong>Cliquez</strong> ou <strong>glissez-déposez</strong> vos images</p>
              <p style="font-size:0.75rem;color:var(--admin-text-muted);">PNG, JPG, WebP — plusieurs à la fois</p>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h2>Médiathèque <span id="count-badge" style="color:var(--admin-text-muted);font-weight:400;font-size:0.875rem;"></span></h2>
            <input type="search" id="search" placeholder="Rechercher..." oninput="renderMedia()" style="padding:7px 12px;border:1px solid var(--admin-border);border-radius:var(--admin-radius-sm);font-size:0.8125rem;background:var(--admin-surface);color:var(--admin-text);min-width:200px;">
          </div>
          <div class="admin-card-body">
            <div id="media-grid" class="image-preview-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));gap:12px;"></div>
            <div id="media-empty" class="admin-empty" style="display:none;">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
              </svg>
              <h3>Médiathèque vide</h3>
              <p>Uploadez vos images pour les utiliser partout dans votre boutique.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let allMedia = [];

    async function loadPage() {
      if (!await checkAdminAuth()) return;
      renderAdminSidebar('media');
      renderAdminTopbar(i18n.t('admin.media'));

      initImageUpload(document.getElementById('upload-area'), async (url) => {
        await refresh();
      }, { folder: 'library', multiple: true });

      await refresh();
    }

    async function refresh() {
      if (STORE_CONFIG.demoMode) {
        allMedia = [];
        document.getElementById('media-grid').innerHTML = '';
        const empty = document.getElementById('media-empty');
        empty.style.display = 'block';
        empty.innerHTML = `
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <h3>Mode démo</h3>
          <p>La médiathèque nécessite Supabase. Configurez-le pour uploader et stocker vos images.</p>
        `;
        return;
      }
      try {
        allMedia = await store.listMedia();
        renderMedia();
      } catch (e) {
        console.error(e);
        showToast('Erreur chargement médias: ' + (e.message || e), 'error', 5000);
      }
    }

    function renderMedia() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = q ? allMedia.filter(m => (m.file_name || '').toLowerCase().includes(q)) : allMedia;
      const grid = document.getElementById('media-grid');
      const empty = document.getElementById('media-empty');

      document.getElementById('count-badge').textContent = list.length ? `— ${list.length}` : '';

      if (!list.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = list.map(m => `
        <div class="image-preview" style="aspect-ratio:1;cursor:pointer;" onclick="copyUrl('${m.file_url}')" title="Cliquer pour copier l'URL">
          <img src="${m.file_url}" alt="${m.file_name}" style="width:100%;height:100%;object-fit:cover;">
          <button class="image-preview-remove" onclick="event.stopPropagation(); removeMedia('${m.id}', '${m.file_url.replace(/'/g, "\\'")}')" title="Supprimer">×</button>
          <div style="position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent, rgba(0,0,0,0.75));color:#fff;font-size:0.6875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            ${m.file_name || '—'}
          </div>
        </div>
      `).join('');
    }

    async function copyUrl(url) {
      try {
        await navigator.clipboard.writeText(url);
        showToast('URL copiée', 'success');
      } catch (e) {
        showToast('Impossible de copier', 'error');
      }
    }

    async function removeMedia(id, fileUrl) {
      const ok = await confirmAction('Supprimer cette image ?', { confirmLabel: 'Supprimer', danger: true });
      if (!ok) return;
      try {
        await store.deleteMedia(id, fileUrl);
        await refresh();
        showToast('Image supprimée', 'success');
      } catch (e) {
        showToast('Erreur: ' + (e.message || e), 'error', 5000);
      }
    }

    document.addEventListener('DOMContentLoaded', loadPage);
  </script>
</body>
</html>
