<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akram Store — Médiathèque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div class="admin-card" style="margin-bottom: 16px;">
          <div class="admin-card-body">
            <div class="image-upload-area" id="upload-area" onclick="triggerUpload()">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <p>Cliquez ou glissez-déposez vos images ici</p>
              <p style="font-size:0.75rem;color:var(--color-text-muted);">PNG, JPG, WebP — Max 5MB</p>
            </div>
            <input type="file" id="file-input" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
          </div>
        </div>

        <!-- Folder filter -->
        <div class="category-filters" style="margin-bottom: 16px;">
          <button class="filter-chip active" onclick="filterFolder(null, this)">Tous</button>
          <button class="filter-chip" onclick="filterFolder('caftans', this)">Caftans</button>
          <button class="filter-chip" onclick="filterFolder('burkinis', this)">Burkinis</button>
          <button class="filter-chip" onclick="filterFolder('banners', this)">Bannières</button>
          <button class="filter-chip" onclick="filterFolder('logo', this)">Logo</button>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h2>📸 Images</h2>
          </div>
          <div class="admin-card-body">
            <div class="image-preview-grid" id="media-grid" style="grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));">
            </div>
            <div class="admin-empty" id="media-empty">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
              </svg>
              <h3>Médiathèque vide</h3>
              <p>Uploadez vos images pour les utiliser dans vos produits et bannières.</p>
              <p style="font-size:0.75rem;color:var(--color-text-muted);margin-top:8px;">
                Nécessite Supabase Storage configuré. En mode démo, l'upload est simulé.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    async function loadMedia() {
      if (!await checkAdminAuth()) return;

      renderAdminSidebar('media');
      renderAdminTopbar(i18n.t('admin.media'));
    }

    function triggerUpload() {
      document.getElementById('file-input').click();
    }

    function handleFiles(files) {
      if (STORE_CONFIG.demoMode) {
        alert('En mode démo, l\'upload est simulé. Configurez Supabase Storage pour uploader de vraies images.');
        // Show preview of selected files
        const grid = document.getElementById('media-grid');
        document.getElementById('media-empty').style.display = 'none';

        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const div = document.createElement('div');
            div.className = 'image-preview';
            div.style.aspectRatio = '1';
            div.innerHTML = `
              <img src="${e.target.result}" alt="${file.name}">
              <button class="image-preview-remove" onclick="this.parentElement.remove()">×</button>
            `;
            grid.appendChild(div);
          };
          reader.readAsDataURL(file);
        });
        return;
      }

      // Real upload with Supabase Storage
      Array.from(files).forEach(async file => {
        try {
          const fileName = `${Date.now()}-${file.name}`;
          const { data, error } = await store.supabase.storage
            .from('media')
            .upload(fileName, file);
          if (error) throw error;

          const { data: urlData } = store.supabase.storage
            .from('media')
            .getPublicUrl(fileName);

          // Save to media table
          await store.supabase.from('media').insert({
            file_name: file.name,
            file_url: urlData.publicUrl,
            file_size: file.size,
            mime_type: file.type,
          });

          loadMedia();
        } catch (e) {
          console.error('Upload failed:', e);
          alert('Upload failed: ' + e.message);
        }
      });
    }

    function filterFolder(folder, btn) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      // Would filter media by folder in production
    }

    // Drag and drop
    const dropArea = document.getElementById('upload-area');
    if (dropArea) {
      ['dragenter', 'dragover'].forEach(ev => {
        document.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
      });
      dropArea.addEventListener('dragover', e => {
        e.preventDefault();
        dropArea.style.borderColor = 'var(--admin-primary)';
        dropArea.style.background = 'rgba(139,26,43,0.05)';
      });
      dropArea.addEventListener('dragleave', e => {
        dropArea.style.borderColor = '';
        dropArea.style.background = '';
      });
      dropArea.addEventListener('drop', e => {
        e.preventDefault();
        dropArea.style.borderColor = '';
        dropArea.style.background = '';
        handleFiles(e.dataTransfer.files);
      });
    }

    document.addEventListener('DOMContentLoaded', loadMedia);
  </script>
</body>
</html>
