<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Produits — Collection By Ibtissam Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('cbi_admin_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-admin-theme', theme);
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div class="admin-card" style="margin-bottom:12px;">
          <div class="admin-card-body" style="padding:16px 20px;">
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end;">
              <div class="form-group" style="margin:0;">
                <label>Recherche</label>
                <input type="search" id="search" placeholder="Nom du produit..." oninput="applyFilters()">
              </div>
              <div class="form-group" style="margin:0;">
                <label>Catégorie</label>
                <select id="filter-cat" onchange="applyFilters()"><option value="">Toutes</option></select>
              </div>
              <div class="form-group" style="margin:0;">
                <label>Statut</label>
                <select id="filter-status" onchange="applyFilters()">
                  <option value="">Tous</option>
                  <option value="active">Actif</option>
                  <option value="draft">Brouillon</option>
                  <option value="archived">Archivé</option>
                </select>
              </div>
              <div class="form-group" style="margin:0;">
                <label>Trier</label>
                <select id="sort" onchange="applyFilters()">
                  <option value="newest">Plus récents</option>
                  <option value="name">Nom</option>
                  <option value="price_asc">Prix croissant</option>
                  <option value="price_desc">Prix décroissant</option>
                  <option value="stock">Stock (bas)</option>
                  <option value="popular">Popularité</option>
                </select>
              </div>
              <button class="btn btn-outline btn-sm" onclick="clearFilters()">Réinitialiser</button>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h2>Produits <span id="count-badge" style="color:var(--color-text-muted);font-weight:400;font-size:0.875rem;"></span></h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('csv-import').click()">⬆ Importer CSV</button>
              <input type="file" id="csv-import" accept=".csv,text/csv" style="display:none;" onchange="importCSV(this.files[0])">
              <button class="btn btn-outline btn-sm" onclick="exportProductsCSV()">⬇ Exporter CSV</button>
              <a href="product-edit.html" class="btn btn-primary btn-sm">+ Nouveau Produit</a>
            </div>
          </div>

          <!-- Bulk actions toolbar -->
          <div id="bulk-bar" style="display:none;padding:12px 20px;background:var(--admin-primary);color:#fff;align-items:center;gap:10px;flex-wrap:wrap;">
            <span id="bulk-count" style="font-weight:600;"></span>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);" onclick="bulkSetStatus('active')">Activer</button>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);" onclick="bulkSetStatus('draft')">Brouillon</button>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);" onclick="bulkSetStatus('archived')">Archiver</button>
            <select id="bulk-cat-select" style="padding:5px 8px;border-radius:6px;border:none;font-size:0.8125rem;">
              <option value="">— Changer catégorie —</option>
            </select>
            <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.3);" onclick="bulkSetCategory()">Appliquer</button>
            <button class="btn btn-sm" style="background:rgba(220,38,38,0.8);color:#fff;border:none;margin-inline-start:auto;" onclick="bulkDelete()">🗑 Supprimer</button>
            <button class="btn btn-sm" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3);" onclick="clearSelection()">Annuler</button>
          </div>
          <div class="table-overflow">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width:36px;"><input type="checkbox" id="check-all" onchange="toggleAll(this.checked)"></th>
                  <th style="width:60px">Image</th>
                  <th>Nom</th>
                  <th>Catégorie</th>
                  <th>Prix</th>
                  <th>Stock</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let allProducts = [];
    let allCategories = [];
    let selected = new Set();

    async function load() {
      if (!await checkAdminAuth()) return;
      renderAdminSidebar('products');
      renderAdminTopbar(i18n.t('admin.products'));
      [allProducts, allCategories] = await Promise.all([store.getProducts({}), store.getCategories()]);

      const sel = document.getElementById('filter-cat');
      allCategories.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = i18n.field(c, 'name');
        sel.appendChild(o);
      });

      applyFilters();
    }

    function clearFilters() {
      document.getElementById('search').value = '';
      document.getElementById('filter-cat').value = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('sort').value = 'newest';
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const cat = document.getElementById('filter-cat').value;
      const status = document.getElementById('filter-status').value;
      const sort = document.getElementById('sort').value;

      let list = allProducts.filter(p => {
        if (cat && p.category_id !== cat) return false;
        if (status && p.status !== status) return false;
        if (q) {
          const hay = `${p.name_fr || ''} ${p.name_ar || ''} ${p.slug || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      switch (sort) {
        case 'name': list.sort((a, b) => (a.name_fr || '').localeCompare(b.name_fr || '')); break;
        case 'price_asc': list.sort((a, b) => (a.sale_price || a.base_price) - (b.sale_price || b.base_price)); break;
        case 'price_desc': list.sort((a, b) => (b.sale_price || b.base_price) - (a.sale_price || a.base_price)); break;
        case 'stock': list.sort((a, b) => a.stock_quantity - b.stock_quantity); break;
        case 'popular': list.sort((a, b) => (b.views_count || 0) - (a.views_count || 0)); break;
        default: break;
      }

      document.getElementById('count-badge').textContent = list.length ? `— ${list.length}` : '';

      const tbody = document.getElementById('products-table');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="admin-empty"><h3>Aucun produit</h3><a href="product-edit.html" class="btn btn-primary btn-sm">+ Ajouter</a></div></td></tr>`;
        return;
      }

      const catMap = Object.fromEntries(allCategories.map(c => [c.id, c]));

      tbody.innerHTML = list.map(p => {
        const img = p.images ? (p.images.find(i => i.is_primary) || p.images[0]) : null;
        const imgUrl = img?.image_url || `https://placehold.co/50x50/f7f5f1/8c8c8c?text=—`;
        const cat = catMap[p.category_id] || p.category;
        const stockStyle = p.stock_quantity <= 0 ? 'color:var(--color-danger);font-weight:600;'
          : p.stock_quantity <= 5 ? 'color:var(--color-warning);font-weight:600;' : '';
        const statusClass = p.status === 'active' ? 'status-active' : p.status === 'draft' ? 'status-draft' : 'status-archived';
        const flags = [];
        if (p.is_featured) flags.push('★');
        if (p.is_new_arrival) flags.push('NEW');
        if (p.is_best_seller) flags.push('BEST');
        return `
          <tr>
            <td><input type="checkbox" data-id="${p.id}" ${selected.has(p.id) ? 'checked' : ''} onchange="toggleOne('${p.id}', this.checked)"></td>
            <td><img src="${imgUrl}" alt="" style="width:50px;height:50px;object-fit:cover;"></td>
            <td>
              <div style="font-weight:500;">${i18n.field(p, 'name')}</div>
              <div style="display:flex;gap:6px;margin-top:2px;font-size:0.6875rem;color:var(--color-text-muted);">
                ${flags.map(f => `<span>${f}</span>`).join('')}
                ${p.sale_price ? `<span style="color:var(--color-danger);">PROMO</span>` : ''}
              </div>
            </td>
            <td>${cat ? i18n.field(cat, 'name') : '—'}</td>
            <td>
              ${i18n.formatPrice(p.sale_price || p.base_price)}
              ${p.sale_price ? `<br><small style="text-decoration:line-through;color:var(--color-text-muted);">${i18n.formatPrice(p.base_price)}</small>` : ''}
            </td>
            <td style="${stockStyle}">${p.stock_quantity}</td>
            <td><span class="status-badge ${statusClass}">${p.status}</span></td>
            <td>
              <div class="table-actions">
                <a href="product-edit.html?id=${p.id}" class="table-action" title="Modifier">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </a>
                <a href="../product.html?slug=${p.slug}" class="table-action" target="_blank" title="Voir sur le site">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </a>
                <button class="table-action" onclick="duplicateProduct('${p.id}')" title="Dupliquer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button class="table-action danger" onclick="deleteProduct('${p.id}', '${i18n.field(p, 'name').replace(/'/g, "\\'")}')" title="Supprimer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleAll(checked) {
      document.querySelectorAll('#products-table input[type="checkbox"]').forEach(cb => {
        cb.checked = checked;
        const id = cb.dataset.id;
        if (checked) selected.add(id); else selected.delete(id);
      });
      updateBulkBtn();
    }

    function toggleOne(id, checked) {
      if (checked) selected.add(id); else selected.delete(id);
      updateBulkBtn();
    }

    function updateBulkBtn() {
      const bar = document.getElementById('bulk-bar');
      const count = document.getElementById('bulk-count');
      if (selected.size > 0) {
        bar.style.display = 'flex';
        count.textContent = `${selected.size} sélectionné${selected.size > 1 ? 's' : ''}`;
      } else {
        bar.style.display = 'none';
      }
      // populate category select if empty
      const sel = document.getElementById('bulk-cat-select');
      if (sel && sel.options.length <= 1) {
        allCategories.forEach(c => {
          const o = document.createElement('option');
          o.value = c.id;
          o.textContent = i18n.field(c, 'name');
          sel.appendChild(o);
        });
      }
    }

    function clearSelection() {
      selected.clear();
      document.querySelectorAll('#products-table input[type="checkbox"]').forEach(cb => cb.checked = false);
      document.getElementById('check-all').checked = false;
      updateBulkBtn();
    }

    async function bulkDelete() {
      if (!selected.size) return;
      const ok = await confirmAction(`Supprimer ${selected.size} produit${selected.size > 1 ? 's' : ''} ?`, { confirmLabel: 'Supprimer', danger: true });
      if (!ok) return;
      const toast = showToast('Suppression en cours…', 'loading', 0);
      try {
        for (const id of selected) await store.deleteProduct(id);
        selected.clear();
        allProducts = await store.getProducts({});
        toast.remove();
        showToast('Produits supprimés', 'success');
        updateBulkBtn();
        applyFilters();
      } catch (e) {
        toast.remove();
        showToast('Erreur: ' + (e.message || e), 'error', 5000);
      }
    }

    async function bulkSetStatus(status) {
      if (!selected.size) return;
      const toast = showToast('Mise à jour…', 'loading', 0);
      try {
        for (const id of selected) await store.updateProduct(id, { status });
        allProducts = await store.getProducts({});
        toast.remove();
        showToast(`Statut mis à jour (${selected.size})`, 'success');
        applyFilters();
      } catch (e) {
        toast.remove();
        showToast('Erreur: ' + (e.message || e), 'error', 5000);
      }
    }

    async function bulkSetCategory() {
      const cat = document.getElementById('bulk-cat-select').value;
      if (!cat || !selected.size) return;
      const toast = showToast('Mise à jour…', 'loading', 0);
      try {
        for (const id of selected) await store.updateProduct(id, { category_id: cat });
        allProducts = await store.getProducts({});
        toast.remove();
        showToast('Catégorie mise à jour', 'success');
        applyFilters();
      } catch (e) {
        toast.remove();
        showToast('Erreur: ' + (e.message || e), 'error', 5000);
      }
    }

    // ---- CSV export/import ----
    function exportProductsCSV() {
      const rows = applyFiltersGetList();
      if (!rows.length) { showToast('Aucun produit à exporter', 'info'); return; }
      const header = ['name_fr', 'name_ar', 'slug', 'category', 'base_price', 'sale_price', 'stock_quantity', 'status', 'description_fr', 'description_ar', 'sku', 'is_featured', 'is_new_arrival', 'is_best_seller'];
      const catMap = Object.fromEntries(allCategories.map(c => [c.id, c.name_fr || c.name_ar || c.slug]));
      const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [header.map(esc).join(',')];
      rows.forEach(p => lines.push([
        p.name_fr, p.name_ar, p.slug, catMap[p.category_id] || '',
        p.base_price, p.sale_price || '', p.stock_quantity ?? 0, p.status,
        (p.description_fr || '').replace(/\r?\n/g, ' '),
        (p.description_ar || '').replace(/\r?\n/g, ' '),
        p.sku || '', p.is_featured ? 1 : 0, p.is_new_arrival ? 1 : 0, p.is_best_seller ? 1 : 0
      ].map(esc).join(',')));
      const csv = '﻿' + lines.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `produits-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function applyFiltersGetList() {
      // Mirror the filtering used by applyFilters() but return the array
      const q = document.getElementById('search').value.trim().toLowerCase();
      const cat = document.getElementById('filter-cat').value;
      const status = document.getElementById('filter-status').value;
      return allProducts.filter(p => {
        if (cat && p.category_id !== cat) return false;
        if (status && p.status !== status) return false;
        if (q) {
          const hay = `${p.name_fr || ''} ${p.name_ar || ''} ${p.slug || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function parseCSV(text) {
      // Minimal RFC4180 CSV parser (handles quoted fields with commas/newlines)
      const rows = [];
      let i = 0, field = '', row = [], inQuotes = false;
      while (i < text.length) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
            inQuotes = false; i++; continue;
          }
          field += c; i++;
        } else {
          if (c === '"') { inQuotes = true; i++; }
          else if (c === ',') { row.push(field); field = ''; i++; }
          else if (c === '\n' || c === '\r') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(field); rows.push(row); row = []; field = ''; i++;
          } else { field += c; i++; }
        }
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => r.length && r.some(c => c.trim() !== ''));
    }

    async function importCSV(file) {
      if (!file) return;
      const text = await file.text();
      const rows = parseCSV(text.replace(/^﻿/, ''));
      if (rows.length < 2) { showToast('CSV vide ou invalide', 'error'); return; }
      const header = rows[0].map(h => h.trim());
      const idx = (name) => header.indexOf(name);
      const need = ['name_fr', 'base_price'];
      for (const col of need) {
        if (idx(col) === -1) { showToast(`Colonne requise manquante: ${col}`, 'error', 5000); return; }
      }
      const ok = await confirmAction(`Importer ${rows.length - 1} produit(s) depuis ce fichier ?`, { confirmLabel: 'Importer' });
      if (!ok) return;

      const catByName = {};
      allCategories.forEach(c => {
        catByName[(c.name_fr || '').toLowerCase()] = c.id;
        catByName[(c.name_ar || '').toLowerCase()] = c.id;
        catByName[(c.slug || '').toLowerCase()] = c.id;
      });

      const toast = showToast(`Import 0 / ${rows.length - 1}…`, 'loading', 0);
      let done = 0, errors = 0;
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const get = (name) => (idx(name) >= 0 ? (row[idx(name)] || '').trim() : '');
        const name_fr = get('name_fr');
        if (!name_fr) { errors++; continue; }
        const slug = get('slug') || name_fr.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') + '-' + Date.now().toString(36).slice(-4);
        const payload = {
          name_fr,
          name_ar: get('name_ar'),
          slug,
          category_id: catByName[get('category').toLowerCase()] || null,
          base_price: parseFloat(get('base_price')) || 0,
          sale_price: parseFloat(get('sale_price')) || null,
          stock_quantity: parseInt(get('stock_quantity'), 10) || 0,
          status: get('status') || 'draft',
          description_fr: get('description_fr'),
          description_ar: get('description_ar'),
          sku: get('sku'),
          is_featured: ['1', 'true', 'yes', 'oui'].includes(get('is_featured').toLowerCase()),
          is_new_arrival: ['1', 'true', 'yes', 'oui'].includes(get('is_new_arrival').toLowerCase()),
          is_best_seller: ['1', 'true', 'yes', 'oui'].includes(get('is_best_seller').toLowerCase()),
        };
        try {
          await store.createProduct(payload);
          done++;
        } catch (e) {
          console.error('Row', r, e);
          errors++;
        }
        const span = toast.querySelector('span');
        if (span) span.textContent = `Import ${done} / ${rows.length - 1}${errors ? ` (${errors} erreurs)` : ''}…`;
      }
      toast.remove();
      showToast(`${done} importé${done > 1 ? 's' : ''}${errors ? `, ${errors} erreurs` : ''}`, errors ? 'error' : 'success', 5000);
      allProducts = await store.getProducts({});
      applyFilters();
    }

    async function duplicateProduct(id) {
      const src = allProducts.find(p => p.id === id);
      if (!src) return;
      const { id: _drop, created_at, updated_at, views_count, ...clone } = src;
      clone.name_fr = (src.name_fr || '') + ' (copie)';
      clone.name_ar = (src.name_ar || '') + ' (نسخة)';
      clone.slug = (src.slug || '') + '-copy-' + Date.now().toString(36);
      clone.status = 'draft';
      try {
        await store.createProduct(clone);
        allProducts = await store.getProducts({});
        applyFilters();
      } catch (e) {
        showToast('Erreur: ' + (e.message || e), 'error', 5000);
      }
    }

    async function deleteProduct(id, name) {
      const ok = await confirmAction(`Supprimer "${name}" ?`, { confirmLabel: 'Supprimer', danger: true });
      if (!ok) return;
      try {
        await store.deleteProduct(id);
        allProducts = allProducts.filter(p => p.id !== id);
        applyFilters();
      } catch (e) {
        showToast('Erreur: ' + (e.message || e), 'error', 5000);
      }
    }

    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
