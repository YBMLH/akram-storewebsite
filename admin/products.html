<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akram Store — Produits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header">
            <h2>${'Liste des Produits'}</h2>
            <a href="product-edit.html" class="btn btn-primary btn-sm">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              ${i18n.currentLang === 'ar' ? 'إضافة منتج' : 'Ajouter un Produit'}
            </a>
          </div>
          <div class="table-overflow">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width:60px">Image</th>
                  <th>Nom</th>
                  <th>Catégorie</th>
                  <th>Prix</th>
                  <th>Stock</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    async function loadProducts() {
      if (!await checkAdminAuth()) return;

      renderAdminSidebar('products');
      renderAdminTopbar(i18n.t('admin.products'), `
        <a href="product-edit.html" class="btn btn-primary btn-sm">+ ${i18n.currentLang === 'ar' ? 'إضافة' : 'Ajouter'}</a>
      `);

      try {
        const products = await store.getProducts({});
        const categories = await store.getCategories();
        const catMap = {};
        categories.forEach(c => catMap[c.id] = c);

        const tbody = document.getElementById('products-table');

        if (products.length === 0) {
          tbody.innerHTML = `
            <tr><td colspan="7">
              <div class="admin-empty">
                <h3>Aucun produit</h3>
                <p>Commencez par ajouter votre premier produit.</p>
                <a href="product-edit.html" class="btn btn-primary btn-sm">Ajouter un Produit</a>
              </div>
            </td></tr>
          `;
          return;
        }

        tbody.innerHTML = products.map(p => {
          const img = p.images ? (p.images.find(i => i.is_primary) || p.images[0]) : null;
          const imgUrl = img?.image_url || `https://placehold.co/50x50/e2e8f0/666?text=...`;
          const cat = catMap[p.category_id] || p.category;
          const stockStyle = p.stock_quantity <= 0 ? 'color:var(--color-danger);font-weight:700' :
                           p.stock_quantity <= 5 ? 'color:var(--color-warning);font-weight:700' : '';
          const statusClass = p.status === 'active' ? 'status-active' : p.status === 'draft' ? 'status-draft' : 'status-archived';

          return `
            <tr>
              <td>
                <img src="${imgUrl}" alt="" style="width:50px;height:50px;object-fit:cover;border-radius:6px;">
              </td>
              <td>
                <div style="font-weight:500;">${i18n.field(p, 'name')}</div>
                ${p.sale_price ? `<span style="font-size:0.75rem;color:var(--color-danger);">Promo: ${i18n.formatPrice(p.sale_price)}</span>` : ''}
              </td>
              <td>${cat ? i18n.field(cat, 'name') : '—'}</td>
              <td>${i18n.formatPrice(p.sale_price || p.base_price)}</td>
              <td style="${stockStyle}">${p.stock_quantity}</td>
              <td><span class="status-badge ${statusClass}">${p.status}</span></td>
              <td>
                <div class="table-actions">
                  <a href="product-edit.html?id=${p.id}" class="table-action" title="Modifier">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  </a>
                  <a href="../product.html?slug=${p.slug}" class="table-action" target="_blank" title="Voir">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </a>
                  <button class="table-action danger" onclick="deleteProduct('${p.id}', '${i18n.field(p, 'name').replace(/'/g, "\\'")}')" title="Supprimer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        console.error('Failed to load products:', e);
      }
    }

    async function deleteProduct(id, name) {
      if (!confirm(`Supprimer "${name}" ?`)) return;
      try {
        await store.deleteProduct(id);
        loadProducts();
      } catch (e) {
        console.error('Failed to delete product:', e);
        alert('Error deleting product');
      }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
