<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Analyses — Collection By Ibtissam Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
          <button class="filter-chip active" data-range="7" onclick="setRange(7, this)">7 jours</button>
          <button class="filter-chip" data-range="30" onclick="setRange(30, this)">30 jours</button>
          <button class="filter-chip" data-range="90" onclick="setRange(90, this)">90 jours</button>
        </div>

        <div class="stats-grid" id="stats-grid"></div>

        <div class="admin-card" style="margin-bottom:16px;">
          <div class="admin-card-header"><h2>Chiffre d'Affaires</h2></div>
          <div class="admin-card-body">
            <div id="sales-chart"></div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="admin-card">
            <div class="admin-card-header"><h2>Top Wilayas</h2></div>
            <div class="admin-card-body"><div id="wilaya-list"></div></div>
          </div>
          <div class="admin-card">
            <div class="admin-card-header"><h2>Statuts des Commandes</h2></div>
            <div class="admin-card-body"><div id="status-list"></div></div>
          </div>
        </div>

        <div class="admin-card" style="margin-top:16px;">
          <div class="admin-card-header"><h2>Produits Populaires</h2></div>
          <div class="table-overflow">
            <table class="admin-table">
              <thead><tr><th></th><th>Produit</th><th>Prix</th><th>Stock</th><th>Vues</th></tr></thead>
              <tbody id="top-products"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let currentDays = 7;

    async function load() {
      if (!await checkAdminAuth()) return;
      renderAdminSidebar('analytics');
      renderAdminTopbar(i18n.t('admin.analytics'));
      await refresh();
    }

    async function refresh() {
      const a = await store.getAnalytics(currentDays);

      // Stat cards
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
          <div class="stat-icon sales">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="stat-info">
            <h3>Chiffre d'Affaires</h3>
            <div class="stat-value">${i18n.formatPrice(a.totalSales)}</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orders">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          </div>
          <div class="stat-info">
            <h3>Commandes</h3>
            <div class="stat-value">${a.totalOrders}</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon products">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div class="stat-info">
            <h3>Panier Moyen</h3>
            <div class="stat-value">${i18n.formatPrice(a.avgOrderValue)}</div>
          </div>
        </div>
      `;

      // Sales chart (SVG bar chart)
      renderSalesChart(a.byDay);

      // Wilaya list
      const wMax = Math.max(1, ...a.byWilaya.map(w => w.count));
      document.getElementById('wilaya-list').innerHTML = a.byWilaya.length
        ? a.byWilaya.map(w => `
            <div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.875rem;">
                <span><strong>${w.wilaya}</strong></span>
                <span style="color:var(--color-text-muted);">${w.count} commande${w.count > 1 ? 's' : ''}</span>
              </div>
              <div style="height:6px;background:var(--admin-bg);"><div style="height:100%;background:var(--admin-primary);width:${(w.count/wMax)*100}%;"></div></div>
            </div>
          `).join('')
        : `<p style="color:var(--color-text-muted);text-align:center;padding:24px;">Aucune donnée</p>`;

      // Status list
      const statusLabels = {
        new: 'Nouveau', contacted: 'Contacté', confirmed: 'Confirmé',
        preparing: 'En Préparation', shipped: 'Expédié', delivered: 'Livré', cancelled: 'Annulé'
      };
      const statusColors = {
        new: '#2563EB', contacted: '#7C3AED', confirmed: '#059669',
        preparing: '#D97706', shipped: '#0D9488', delivered: '#16A34A', cancelled: '#DC2626'
      };
      const totalOrders = Object.values(a.byStatus).reduce((s, n) => s + n, 0);
      document.getElementById('status-list').innerHTML = totalOrders
        ? Object.entries(a.byStatus).map(([status, count]) => `
            <div style="margin-bottom:12px;">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.875rem;">
                <span><strong>${statusLabels[status] || status}</strong></span>
                <span style="color:var(--color-text-muted);">${count} (${Math.round(count/totalOrders*100)}%)</span>
              </div>
              <div style="height:6px;background:var(--admin-bg);"><div style="height:100%;background:${statusColors[status] || '#666'};width:${(count/totalOrders)*100}%;"></div></div>
            </div>
          `).join('')
        : `<p style="color:var(--color-text-muted);text-align:center;padding:24px;">Aucune commande</p>`;

      // Top products
      document.getElementById('top-products').innerHTML = a.topProducts.map((p, i) => {
        const img = p.images ? (p.images.find(x => x.is_primary) || p.images[0]) : null;
        return `
          <tr>
            <td><img src="${img?.image_url || 'https://placehold.co/40x40/f7f5f1/8c8c8c?text=—'}" style="width:40px;height:40px;object-fit:cover;"></td>
            <td>${i18n.field(p, 'name')}</td>
            <td>${i18n.formatPrice(p.sale_price || p.base_price)}</td>
            <td>${p.stock_quantity}</td>
            <td>${p.views_count || 0}</td>
          </tr>
        `;
      }).join('');
    }

    function renderSalesChart(data) {
      const container = document.getElementById('sales-chart');
      const w = 800, h = 220, padL = 48, padR = 16, padT = 12, padB = 40;
      const cw = w - padL - padR, ch = h - padT - padB;
      const max = Math.max(1, ...data.map(d => d.sales));
      const barW = cw / data.length * 0.7;
      const step = cw / data.length;

      const bars = data.map((d, i) => {
        const bh = (d.sales / max) * ch;
        const x = padL + i * step + (step - barW) / 2;
        const y = padT + ch - bh;
        return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="#1A1A1A" opacity="${d.sales > 0 ? 1 : 0.15}">
          <title>${d.date}: ${i18n.formatPrice(d.sales)} — ${d.orders} commande${d.orders > 1 ? 's' : ''}</title>
        </rect>`;
      }).join('');

      // Y-axis labels
      const yLabels = [0, 0.5, 1].map(f => {
        const y = padT + ch - (f * ch);
        return `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8C8C8C">${i18n.formatPrice(Math.round(max * f))}</text>
                <line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#E8E5E1" stroke-width="0.5"/>`;
      }).join('');

      // X-axis labels (every N-th)
      const stride = data.length > 15 ? Math.ceil(data.length / 8) : (data.length > 8 ? 2 : 1);
      const xLabels = data.map((d, i) => {
        if (i % stride !== 0) return '';
        const x = padL + i * step + step / 2;
        const day = d.date.slice(5); // MM-DD
        return `<text x="${x}" y="${h - 12}" text-anchor="middle" font-size="10" fill="#8C8C8C">${day}</text>`;
      }).join('');

      container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;font-family:Inter,sans-serif;">${yLabels}${bars}${xLabels}</svg>`;
    }

    function setRange(days, btn) {
      currentDays = days;
      document.querySelectorAll('[data-range]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      refresh();
    }

    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
