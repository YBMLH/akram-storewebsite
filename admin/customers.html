<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <title>Clients — Collection By Ibtissam Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <div class="admin-topbar" id="admin-topbar"></div>
      <div class="admin-content">
        <div class="admin-card" style="margin-bottom:12px;">
          <div class="admin-card-body" style="padding:16px 20px;">
            <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;">
              <div class="form-group" style="margin:0;">
                <label>Recherche</label>
                <input type="search" id="search" placeholder="Nom, téléphone, wilaya..." oninput="applyFilters()">
              </div>
              <button class="btn btn-primary btn-sm" onclick="exportCSV()">↓ Exporter CSV</button>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-header">
            <h2>Clients <span id="count-badge" style="color:var(--color-text-muted);font-weight:400;font-size:0.875rem;"></span></h2>
          </div>
          <div class="table-overflow">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>Téléphone</th>
                  <th>Wilaya</th>
                  <th>Commandes</th>
                  <th>Total Dépensé</th>
                  <th>Dernière Commande</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customers-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="cust-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:24px;">
    <div style="background:white;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;" id="cust-modal-body"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/demo-data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/admin/sidebar.js"></script>
  <script>
    let allCustomers = [];
    let allOrders = [];

    async function load() {
      if (!await checkAdminAuth()) return;
      renderAdminSidebar('customers');
      renderAdminTopbar(i18n.t('admin.customers'));
      allOrders = await store.getOrders();
      allCustomers = deriveCustomers(allOrders);
      applyFilters();
    }

    function deriveCustomers(orders) {
      const byPhone = {};
      orders.forEach(o => {
        const key = o.customer_phone;
        if (!byPhone[key]) {
          byPhone[key] = {
            name: o.customer_name,
            phone: o.customer_phone,
            wilaya: o.wilaya,
            total_orders: 0,
            total_spent: 0,
            last_order_at: o.created_at,
            first_order_at: o.created_at,
          };
        }
        const c = byPhone[key];
        c.total_orders += 1;
        c.total_spent += Number(o.total_amount) || 0;
        if (new Date(o.created_at) > new Date(c.last_order_at)) c.last_order_at = o.created_at;
        if (new Date(o.created_at) < new Date(c.first_order_at)) c.first_order_at = o.created_at;
      });
      return Object.values(byPhone).sort((a, b) => b.total_spent - a.total_spent);
    }

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = allCustomers.filter(c => {
        if (!q) return true;
        return `${c.name} ${c.phone} ${c.wilaya}`.toLowerCase().includes(q);
      });
      document.getElementById('count-badge').textContent = list.length ? `— ${list.length}` : '';

      const tbody = document.getElementById('customers-table');
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#999;">Aucun client</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(c => `
        <tr>
          <td><strong>${c.name}</strong></td>
          <td><a href="tel:${c.phone}">${c.phone}</a></td>
          <td>${c.wilaya || '—'}</td>
          <td>${c.total_orders}</td>
          <td><strong>${i18n.formatPrice(c.total_spent)}</strong></td>
          <td style="font-size:0.8125rem;color:var(--color-text-muted);">${i18n.formatDate(c.last_order_at)}</td>
          <td>
            <div class="table-actions">
              <button class="table-action" onclick="viewCustomer('${c.phone.replace(/'/g, "\\'")}')" title="Historique">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button class="table-action" onclick="contactCustomer('${c.phone}', '${c.name.replace(/'/g, "\\'")}')" title="WhatsApp">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function viewCustomer(phone) {
      const c = allCustomers.find(x => x.phone === phone);
      if (!c) return;
      const orders = allOrders.filter(o => o.customer_phone === phone).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      const modal = document.getElementById('cust-modal');
      const body = document.getElementById('cust-modal-body');
      body.innerHTML = `
        <div style="padding:20px 24px;border-bottom:1px solid var(--admin-border);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h2 style="margin:0;">${c.name}</h2>
            <div style="font-size:0.8125rem;color:var(--color-text-muted);margin-top:4px;">${c.phone} · ${c.wilaya || '—'}</div>
          </div>
          <button onclick="document.getElementById('cust-modal').style.display='none'" style="font-size:1.25rem;cursor:pointer;background:none;border:none;color:var(--color-text-muted);">×</button>
        </div>
        <div style="padding:20px 24px;">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
            <div><div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);">Commandes</div><div style="font-size:1.25rem;font-weight:700;">${c.total_orders}</div></div>
            <div><div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);">Total Dépensé</div><div style="font-size:1.25rem;font-weight:700;">${i18n.formatPrice(c.total_spent)}</div></div>
            <div><div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);">Client depuis</div><div style="font-size:0.9375rem;font-weight:500;">${i18n.formatDate(c.first_order_at)}</div></div>
          </div>
          <div style="font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--color-text-muted);margin-bottom:8px;">Historique</div>
          <table class="admin-table">
            <thead><tr><th>#</th><th>Date</th><th>Statut</th><th style="text-align:end;">Total</th></tr></thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td><strong>#${o.order_number}</strong></td>
                  <td style="font-size:0.8125rem;">${i18n.formatDate(o.created_at)}</td>
                  <td>${getStatusLabel(o.status)}</td>
                  <td style="text-align:end;"><strong>${i18n.formatPrice(o.total_amount)}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
      modal.style.display = 'flex';
    }

    function contactCustomer(phone, name) {
      let intPhone = phone.replace(/^0/, '213');
      const msg = i18n.currentLang === 'ar'
        ? `مرحباً ${name}، شكراً لك على ثقتك في مجموعة إبتسام !`
        : `Bonjour ${name}, merci pour votre fidélité chez Collection By Ibtissam !`;
      window.open(`https://wa.me/${intPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function exportCSV() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const rows = allCustomers.filter(c => !q || `${c.name} ${c.phone} ${c.wilaya}`.toLowerCase().includes(q));
      if (!rows.length) return alert('Aucun client à exporter.');
      const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['Nom', 'Téléphone', 'Wilaya', 'Commandes', 'Total Dépensé', 'Dernière Commande'].map(esc).join(',')];
      rows.forEach(c => lines.push([c.name, c.phone, c.wilaya, c.total_orders, c.total_spent, c.last_order_at].map(esc).join(',')));
      const csv = '﻿' + lines.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `clients-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.addEventListener('DOMContentLoaded', load);
    document.addEventListener('click', e => {
      if (e.target.id === 'cust-modal') e.target.style.display = 'none';
    });
  </script>
</body>
</html>
